# Release CI: on a v* tag, build every artifact, publish it and create the GitHub release.
#
#   PyPI   pdfust            wheels + sdist      environment pypi       (Trusted Publishing)
#   npm    @docslurp/pdfust  N-API tarball       environment npm        (Trusted Publishing, provenance)
#   crates pdfust-shim, pdfust                   environment crates-io  (Trusted Publishing; only when
#                                                the repository variable PUBLISH_CRATES is "true")
#   GitHub release with wheels, sdist, npm tarball, SBOM and SHA256SUMS
#
# No long-lived registry token is stored in the repository. Each registry needs a
# Trusted Publisher for owner DocSlurp, repository pdfust, workflow release.yml and
# the environment above; RELEASING.md lists the exact settings.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

env:
  MATURIN_PEP517_ARGS: --locked

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag matches every package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'EOF'
          import json, os, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"]
          versions = {
              "pyproject.toml": tomllib.load(open("pyproject.toml", "rb"))["project"]["version"],
              "rust/Cargo.toml": tomllib.load(open("rust/Cargo.toml", "rb"))["package"]["version"],
              "rust/pdfust-shim/Cargo.toml": tomllib.load(open("rust/pdfust-shim/Cargo.toml", "rb"))["package"]["version"],
              "bindings/node/package.json": json.load(open("bindings/node/package.json"))["version"],
          }
          bad = {path: version for path, version in versions.items() if f"v{version}" != tag}
          if bad:
              sys.exit(f"tag {tag} does not match: {bad}")
          EOF

  build-wheels:
    name: wheel (${{ matrix.platform.target }})
    needs: verify
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist
          manylinux: auto
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Smoke-test installed wheel
        run: python tools/smoke_artifact.py dist --pattern "*.whl"
      - name: Attest wheel build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/*.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.platform.target }}
          path: dist

  build-free-threaded-wheels:
    name: free-threaded wheel (${{ matrix.platform.target }})
    needs: verify
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14t"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist -i python3.14t
          manylinux: auto
      - name: Smoke-test installed free-threaded wheel
        run: python tools/smoke_artifact.py dist --pattern "*cp314t*.whl"
      - name: Attest free-threaded wheel build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/*.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: free-threaded-wheels-${{ matrix.platform.target }}
          path: dist

  build-pyemscripten-wheel:
    name: PyEmscripten wheel (Pyodide 0.28.3)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UV_PYTHON_DOWNLOADS: automatic
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.2"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Restore pinned Pyodide build environment
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tmp/pyodide-0.28.3
          key: >-
            pyodide-0.28.3-${{ runner.os }}-${{
            hashFiles('tools/build_pyodide.sh',
            'tools/pyodide-build-requirements.txt',
            'rust/Cargo.lock') }}
          restore-keys: |
            pyodide-0.28.3-${{ runner.os }}-
      - name: Build and smoke-test PyEmscripten wheel
        run: bash tools/build_pyodide.sh
      - name: Bundle and launch Cloudflare Workers smoke
        run: python tools/smoke_cloudflare.py --wheel dist/pyodide-0.28.3/*.whl
      - name: Attest PyEmscripten wheel build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/pyodide-0.28.3/*.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pyemscripten-wheel-pyodide-0.28.3
          path: dist/pyodide-0.28.3/*.whl

  build-sdist:
    name: sdist
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Smoke-test installed sdist
        run: python tools/smoke_artifact.py dist --pattern "*.tar.gz"
      - name: Attest source distribution provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist

  build-npm:
    name: npm package (linux-x64-gnu)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Build the reproducible npm tarball
        run: bash bindings/node/scripts/pack.sh "$RUNNER_TEMP/npm"
      - name: Smoke-test the installed tarball
        run: |
          mkdir -p dist-npm "$RUNNER_TEMP/npm-smoke"
          cp "$RUNNER_TEMP"/npm/*.tgz dist-npm/
          cd "$RUNNER_TEMP/npm-smoke"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --ignore-scripts "$GITHUB_WORKSPACE"/dist-npm/*.tgz
          node -e "const p = require('@docslurp/pdfust'); const v = p.version(); console.log(v); if (v.version !== process.argv[1]) process.exit(1)" "${GITHUB_REF_NAME#v}"
      - name: Attest npm tarball build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist-npm/*.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: dist-npm/*.tgz

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-wheels, build-free-threaded-wheels, build-pyemscripten-wheel, build-sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: dist
      # Every artifact is downloaded; keep only Python distributions for PyPI. The npm
      # tarball (*.tgz, if build-npm already finished) is published by publish-npm.
      - run: |
          rm -f dist/*.tgz
          mkdir -p release
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist/
          format: spdx-json
          output-file: release/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: release/sbom.spdx.json
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom
          path: release/sbom.spdx.json

  publish-npm:
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-npm, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: dist-npm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Trusted Publishing needs npm 11.5.1 or later; provenance is generated automatically.
      - run: npm install --global npm@11.21.2
      - name: Publish with npm Trusted Publishing
        run: npm publish dist-npm/*.tgz --access public --provenance

  publish-crates:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_CRATES == 'true'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Authenticate with crates.io Trusted Publishing
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish pdfust-shim, then pdfust
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: |
          cargo publish --locked -p pdfust-shim
          cargo publish --locked -p pdfust

  verify-pyemscripten-pypi:
    name: Verify PyEmscripten wheel from PyPI
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON_DOWNLOADS: automatic
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.2"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Resolve and launch the published Cloudflare Workers wheel
        run: >-
          python tools/smoke_cloudflare.py
          --requirement "pdfust==${GITHUB_REF_NAME#v}"
          --attempts 20
          --retry-delay 15

  github-release:
    name: Create immutable GitHub release
    needs: [verify-pyemscripten-pypi, publish-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: release-assets
        run: |
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes release-assets/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
