[project]
name = "pdfust"
version = "0.13.0"
description = "PDF editing, rendering, extraction, and generation for Python, powered by Rust. MIT, no mandatory Python dependencies, lightweight wheels."
authors = [{ "name" = "Yusuke Hayashi", "email" = "yusuke8h@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md", "LICENSES/*"]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: WebAssembly :: Emscripten",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/justsml/pdfust"
Documentation = "https://github.com/justsml/pdfust#readme"
Changelog = "https://github.com/justsml/pdfust/blob/main/CHANGELOG.md"
Issues = "https://github.com/justsml/pdfust/issues"
Source = "https://github.com/justsml/pdfust"

[project.optional-dependencies]
# Script and locale-specific fonts for automatic generation.
ar = ["pdfust-fonts-ar>=0.1.0,<0.2"]
he = ["pdfust-fonts-he>=0.1.0,<0.2"]
hi = ["pdfust-fonts-hi>=0.1.0,<0.2"]
jp = ["pdfust-fonts-jp>=0.1.0,<0.2"]
ko = ["pdfust-fonts-ko>=0.1.0,<0.2"]
th = ["pdfust-fonts-th>=0.1.0,<0.2"]
zh-cn = ["pdfust-fonts-zh-cn>=0.1.0,<0.2"]
zh-tw = ["pdfust-fonts-zh-tw>=0.1.0,<0.2"]
# PP-OCRv6 small detector, recognizer, and multilingual dictionary.
ocr = ["pdfust-ocr-models>=0.1.0,<0.2"]

[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
python-packages = ["pdfust", "jev_pdf", "pylopdf"]
module-name = "pdfust.pdfust_core"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = [
    "maturin>=1.14.1",
    "mypy>=1.14",
    "pre-commit>=4.6.1",
    "pytest>=8.3",
    "ruff>=0.16.0",
]
# Integration tests for the ecosystem recipes in the README; skipped when absent.
interop = [
    "typst>=0.15",
    "pyhanko>=0.36.1",
]
# Comparison libraries for reproducible benchmarks; manual only, not installed in CI.
bench = [
    "pymupdf>=1.26",
    "pypdf>=5",
    "pdfplumber>=0.11",
    "reportlab>=4.2",
]
# Rich conversion studies keep model-backed layout and Markdown parsing optional.
bench-rich = [
    { include-group = "bench" },
    "pymupdf4llm>=1.28.2",
    "markdown-it-py>=4.0",
    "mdit-py-plugins>=0.6",
]
# CPU image-evidence and embedding experiments; no GPU runtime required.
bench-vision = ["pillow>=12.3"]
# Zensical documentation site. CI uses --only-group docs --no-install-project.
docs = [
    "zensical>=0.0.51,<0.1",
]
# Coverage-guided public-API fuzzing; Linux/macOS only.
fuzz = [
    "atheris>=2.3.0",
]

[tool.uv]
# Cache keys that make uv rebuild the extension after Rust source changes.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "rust/Cargo.toml" },
    { file = "rust/build.rs" },
    { file = "rust/src/*.rs" },
    { file = "rust/vendor/**/*.rs" },
]

[tool.uv.workspace]
members = [
    "fonts/pdfust-fonts-ar",
    "fonts/pdfust-fonts-he",
    "fonts/pdfust-fonts-hi",
    "fonts/pdfust-fonts-jp",
    "fonts/pdfust-fonts-ko",
    "fonts/pdfust-fonts-th",
    "fonts/pdfust-fonts-zh-cn",
    "fonts/pdfust-fonts-zh-tw",
    "models/pdfust-ocr-models",
]

[tool.uv.sources]
# Resolve data-only extras to their workspace packages during local development.
pdfust-fonts-ar = { workspace = true }
pdfust-fonts-he = { workspace = true }
pdfust-fonts-hi = { workspace = true }
pdfust-fonts-jp = { workspace = true }
pdfust-fonts-ko = { workspace = true }
pdfust-fonts-th = { workspace = true }
pdfust-fonts-zh-cn = { workspace = true }
pdfust-fonts-zh-tw = { workspace = true }
pdfust-ocr-models = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.mypy.overrides]]
# pypdf is used only by a manually run fixture generator, not as a dev dependency.
module = "pypdf.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Allow type checking without locale-specific font extras installed.
module = [
    "pdfust_fonts_ar",
    "pdfust_fonts_he",
    "pdfust_fonts_hi",
    "pdfust_fonts_jp",
    "pdfust_fonts_ko",
    "pdfust_fonts_th",
    "pdfust_fonts_zh_cn",
    "pdfust_fonts_zh_tw",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Allow type checking without the OCR model extra installed.
module = "pdfust_ocr_models"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Allow type checking without the interop test group.
# cryptography is transitive through pyHanko and absent from the regular dev group.
module = ["typst", "pyhanko.*", "cryptography", "cryptography.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
src = ["src"]
target-version = "py310"
# python/ and lambda_test/ are unrelated colocated work. Keep Markdown examples
# hand-aligned and validate them through the documentation build.
extend-exclude = ["python", "lambda_test", "*.md"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # The repository-level license covers source files without repeated headers.
    "CPY001",
    "D100",
    "D104",
    # Rules that conflict with ruff format.
    "COM812",
    "ISC001",
    "D203",
    "D213",
    # CJK fixture data intentionally contains ambiguous Unicode characters.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Page and Document are cooperating classes that intentionally share internal state.
"src/pdfust/__init__.py" = ["SLF001"]
# S106: fixed test-fixture passwords are not secrets.
# FBT003: set_form_field intentionally accepts bool checkbox values, like pymupdf.
"tests/**" = ["INP001", "S101", "D103", "PLR2004", "TC003", "S106", "FBT003"]
# Manually run generator that prints progress.
"tests/assets/encrypted/generate.py" = ["T201"]
# Integration libraries must be imported after importorskip.
"tests/test_interop.py" = ["E402"]
# Manual benchmark script: prints progress/results, tolerates competitor failures,
# and uses sequential report generation with a loop-local try block.
"bench/**" = ["INP001", "T201", "BLE001", "PLR0915", "PERF203"]
